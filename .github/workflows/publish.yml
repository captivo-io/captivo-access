name: Publish images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # The console calls a connector outdated only when it is older than the last
  # release that changed connector code (src/lib/updates/connector-release.ts).
  # A release that changes it without raising that marker is not published.
  connector-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: scripts/check-connector-release.sh

  # The connector as a program for hosts without Docker (Windows service, Linux
  # systemd unit): archives and SHA256SUMS on the GitHub release, which the
  # console's install command and `connector update` download from.
  connector-binaries:
    needs: connector-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: connector/go.mod }
      - run: scripts/build-connector-binaries.sh "${GITHUB_REF_NAME#v}" dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The release's notes are written by hand after the tag; make the release if it is not there yet.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --title "Captivo Access ${GITHUB_REF_NAME#v}" --notes "Release notes follow."
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  build-and-push:
    needs: connector-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          # Manager + data-plane run on the operator's server (amd64); the
          # connector runs on diverse hardware (Macs, ARM boxes, Raspberry Pi),
          # so it's the one image published multi-arch.
          - image: manager
            dockerfile: Dockerfile
            platforms: linux/amd64
          - image: dataplane
            dockerfile: dataplane/Dockerfile
            platforms: linux/amd64
          - image: connector
            dockerfile: connector/Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: migrate
            dockerfile: migrate/Dockerfile
            platforms: linux/amd64
          - image: kasm-browser
            dockerfile: kasm-browser/Dockerfile
            platforms: linux/amd64
          # guacd with the OSC fix (guacd/Dockerfile): it runs beside the
          # connector, so it follows the connector's architectures.
          - image: guacd
            dockerfile: guacd/Dockerfile
            platforms: linux/amd64,linux/arm64
          # The updater beside the connector (updater/): the only part of a
          # connector host with Docker access, so it follows the connector too.
          - image: updater
            dockerfile: updater/Dockerfile
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/captivo-access-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}

  # Publish a GitHub Release for the tag once the images are built, so the
  # in-app update check (which reads releases/latest) reflects the newest
  # version. Idempotent: skips if a release for the tag already exists.
  release:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
          fi
