# Captivo Access — PRODUCTION stack.
#
# This is separate from the repo-root docker-compose.yml (dev/build stack,
# which builds images locally with `build:`). This file pulls the published
# ghcr.io images and fronts everything with Caddy for automatic HTTPS.
#
# Usage:
#   cp .env.prod.example .env
#   # edit .env with real values
#   docker compose -f docker-compose.prod.yml up -d
#
# See deploy/README.md for the full walkthrough (DNS, TLS). Schema migration runs automatically via the access-migrate service.
#
# The captivo-access images are pinned to a release via ${CAPTIVO_VERSION:-<version>}
# for reproducible installs — set CAPTIVO_VERSION in .env to override/upgrade.
name: captivo-access-prod

services:
  access-postgres:
    image: postgres:16-alpine
    container_name: access-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: access
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: captivo_access
    volumes:
      - access_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U access -d captivo_access"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No published port: only reachable from other containers on this
    # compose network. Connect from the host for maintenance
    # via `docker compose -f docker-compose.prod.yml exec access-postgres ...`
    # or a one-off `docker run --network container:access-postgres ...`.

  # One-shot schema migration. Runs `prisma db push` once against Postgres and
  # exits; the Manager waits for it to complete successfully before starting.
  # Idempotent (a no-op when already in sync) and fail-closed on a destructive
  # diff — see deploy/README.md.
  access-migrate:
    image: ghcr.io/captivo-io/captivo-access-migrate:${CAPTIVO_VERSION:-1.9.0}
    container_name: access-migrate
    depends_on:
      access-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://access:${POSTGRES_PASSWORD:?required}@access-postgres:5432/captivo_access
    restart: "no"

  access-manager:
    image: ghcr.io/captivo-io/captivo-access-manager:${CAPTIVO_VERSION:-1.9.0}
    container_name: access-manager
    restart: unless-stopped
    depends_on:
      access-postgres:
        condition: service_healthy
      access-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://access:${POSTGRES_PASSWORD:?required}@access-postgres:5432/captivo_access
      SESSION_SECRET: ${SESSION_SECRET:?required}
      # WebAuthn Relying Party ID — must be a domain the browser's origin is
      # under. Set to the bare ACCESS_DOMAIN (e.g. access.example.com) so
      # passkeys registered on manager.access.example.com are also valid
      # scoped to the wider domain used by *.access.example.com sites.
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?required}
      # TOTP recovery-secret encryption (AES-256-GCM) — required by the identity layer.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?required}
      INVITE_TTL_HOURS: ${INVITE_TTL_HOURS:-48}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      NODE_ENV: production
      # Data-plane wiring — the Manager talks to the data-plane's internal
      # API (not the public WSS port) to proxy requests to connectors.
      DATAPLANE_URL: http://access-dataplane:3102
      DATAPLANE_SECRET: ${DATAPLANE_SECRET:?required}
      # Cross-subdomain SSO cookie domain — must be a leading-dot domain
      # covering both the Manager and every vendor site subdomain, e.g.
      # .access.example.com, so the session cookie is readable across both.
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:?required}
      # The Manager's own public URL — used to build absolute login redirects
      # (e.g. from the data-plane's proxy back to /login?returnTo=...).
      MANAGER_PUBLIC_URL: ${MANAGER_PUBLIC_URL:?required}
      # The connector tunnel (WSS) endpoint the generated connector install
      # command points at. Defaults to wss://connect.<ACCESS_DOMAIN> so the
      # command is copy-paste-ready; override only if your connect host differs.
      CONNECTOR_TUNNEL_URL: ${CONNECTOR_TUNNEL_URL:-wss://connect.${ACCESS_DOMAIN:?required}}
      # Audit trail retention (days) before POST /api/cron/audit-retention
      # deletes rows. CRON_SECRET authorizes that endpoint (Bearer token).
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-730}
      CRON_SECRET: ${CRON_SECRET:?required}
      # Optional outbound alert when a Site goes down or recovers (best-effort
      # POST). Unset = disabled. See deploy/.env.prod.example.
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
      # Session recording (Pro). On by default; set to 0 to disable the
      # per-Site "Record sessions" toggle. See deploy/.env.prod.example.
      RECORDING_ENABLED: ${RECORDING_ENABLED:-}
      # Native remote-desktop gateway (RDP/SSH/VNC). On by default; set to 0 to
      # hide the "Remote session" Resource type. The connector already bundles
      # guacd. Uses VAULT_ENABLED (also on by default) for credentials.
      NATIVE_GATEWAY: ${NATIVE_GATEWAY:-}
      # Isolated browser (RBI). On by default; set to 0 to hide the "Isolated
      # browser" Resource type. The connector already bundles KasmVNC.
      ISOLATED_ENABLED: ${ISOLATED_ENABLED:-}
      # Credential vault. On by default; set to 0 to disable per-Resource
      # RDP/SSH/VNC credential storage (injected server-side, never shown to the vendor).
      # Required for remote-session logins.
      VAULT_ENABLED: ${VAULT_ENABLED:-}
    # Not published to the host — only Caddy (on the compose network) reaches
    # it, at http://access-manager:3100.
    expose:
      - "3100"

  access-dataplane:
    image: ghcr.io/captivo-io/captivo-access-dataplane:${CAPTIVO_VERSION:-1.9.0}
    container_name: access-dataplane
    restart: unless-stopped
    depends_on:
      access-manager:
        condition: service_started
    environment:
      DATAPLANE_SECRET: ${DATAPLANE_SECRET:?required}
      CONTROL_PLANE_URL: http://access-manager:3100
      WSS_ADDR: ":3101"
      INTERNAL_ADDR: ":3102"
      # Optional: on recorded Sites, require the vendor to acknowledge recording
      # once per session (audited) before app content loads. Off by default; the
      # in-session banner + /access "Recorded" label are the default notice.
      RECORDING_CONSENT_REQUIRED: ${RECORDING_CONSENT_REQUIRED:-}
      # Browser-facing identity-aware proxy listener — this is the port
      # Caddy forwards vendor HTTP(S) traffic to, keyed by hostname.
      PROXY_ADDR: ":3103"
      # Used to build the absolute /login?returnTo= redirect for
      # unauthenticated requests hitting the browser proxy directly.
      MANAGER_PUBLIC_URL: ${MANAGER_PUBLIC_URL:?required}
      # Bounded in-memory audit-event queue depth before the data-plane
      # starts dropping events rather than blocking the proxy.
      AUDIT_QUEUE_CAP: ${AUDIT_QUEUE_CAP:-10000}
    # None of the data-plane ports are published to the host. Caddy terminates
    # TLS and reverse-proxies to them by service name on the compose network:
    #   connect.<ACCESS_DOMAIN> -> :3101  (connector WSS tunnel)
    #   *.<ACCESS_DOMAIN>        -> :3103  (browser-facing proxy)
    # 3102 (internal Manager <-> data-plane API) must never leave this network.
    #
    # Do NOT publish 3101 raw on the host: the data-plane serves plain HTTP on
    # that port (it does not terminate TLS), so a raw-published 3101 would carry
    # the connector tunnel unencrypted over the internet. Front it with Caddy
    # (the connect.<ACCESS_DOMAIN> block in Caddyfile) and point connectors at
    # wss://connect.<ACCESS_DOMAIN> instead.
    expose:
      - "3101"
      - "3103"

  # In-stack scheduler: POSTs the manager's cron endpoints on the internal
  # network (health every 5 min; retention + audit-anchor daily). Replaces the
  # old host-crontab install — works on any host with zero host configuration.
  access-cron:
    image: curlimages/curl:latest
    container_name: access-cron
    restart: unless-stopped
    depends_on:
      access-manager:
        condition: service_started
    environment:
      CRON_SECRET: ${CRON_SECRET:?required}
      MANAGER_URL: http://access-manager:3100
    entrypoint: ["/bin/sh", "/scheduler.sh"]
    volumes:
      - ./cron/scheduler.sh:/scheduler.sh:ro

  caddy:
    image: caddy:2-alpine
    container_name: access-caddy
    restart: unless-stopped
    depends_on:
      - access-manager
      - access-dataplane
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACCESS_DOMAIN: ${ACCESS_DOMAIN:?required}
      # Optional: only needed if you switch the wildcard block in Caddyfile
      # from On-Demand TLS to the DNS-01 directive (requires a custom Caddy
      # build with a DNS plugin — see deploy/README.md and the Caddyfile).
      DNS_API_TOKEN: ${DNS_API_TOKEN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  access_pgdata: {}
  caddy_data: {}
  caddy_config: {}
